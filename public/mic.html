<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <title>MICROFONE PALCO</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="mic-page">
    <div class="mic-wrap">
      <div class="mic-header">
        <div class="brand">PALCO<span>CONTROL</span></div>
        <div class="mic-status"><span class="led" id="st-led"></span><span id="st-text">desconectado</span></div>
      </div>

      <div id="setup-form" class="card">
        <h3>ENTRAR NA SALA</h3>
        <div class="field"><span>SALA</span><input id="setup-room" type="text" value="PALCO" /></div>
        <div class="field"><span>PIN</span><input id="setup-pin" type="text" inputmode="numeric" /></div>
        <div class="field"><span>NOME DO MICROFONE</span><input id="setup-name" type="text" value="Microfone" /></div>
        <button class="btn primary big" id="setup-start">CONECTAR</button>
      </div>

      <div id="mic-console" class="hidden">
        <div class="mic-warning hidden" id="test-banner">Fonte de teste ativa — não é microfone real.</div>
        <div class="mic-info" id="mic-info">eco: ? · ruído: ? · ganho auto: ? · taxa: ? Hz · canal: ?</div>
        <div class="mic-big-meter"><i></i><div class="scale"><span>-60</span><span>-40</span><span>-20</span><span>0</span></div></div>
        <div class="row small"><span id="local-db">sinal local: —</span><span id="support-hint">—</span></div>

        <button class="btn mic-toggle live" id="tx-toggle">TRANSMITINDO — TOQUE PARA PAUSAR</button>

        <div class="card">
          <h3>PROCESSAMENTO NO APARELHO</h3>
          <div class="proc-grid">
            <label><input type="checkbox" id="opt-echo" checked /> eco</label>
            <label><input type="checkbox" id="opt-noise" checked /> ruído</label>
            <label><input type="checkbox" id="opt-agc" checked /> ganho auto</label>
            <label><input type="checkbox" id="opt-mute-local" /> silenciar local</label>
          </div>
          <div class="field"><span>MICROFONE</span><select id="device-select"></select></div>
        </div>

        <div class="row"><span id="mic-name-pill">Microfone</span><button class="btn tiny" id="leave">SAIR</button></div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>
    <script type="module" src="/js/mic.js"></script>
  </body>
</html>
